aid: suplari
name: Suplari
description: 'Suplari is an enterprise procurement intelligence platform that goes beyond spend
  analytics, using AI to clean, classify, and unify fragmented spend data across ERP, P2P, and
  spreadsheet sources. It delivers spend analytics, value orchestration, savings tracking, contract
  intelligence, and ESG intelligence, alongside procurement-specific AI agents (Suplari Worker,
  Assistant, and AI Studio) that integrate with SAP, Oracle, Workday, Coupa, Databricks, Snowflake,
  and Microsoft. Suplari was acquired by Microsoft in 2021. As of this enrichment pass the company
  publishes no public developer API, developer portal, or API documentation surface.'
